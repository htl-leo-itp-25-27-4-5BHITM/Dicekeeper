apiVersion: v1
kind: ConfigMap
metadata:
  name: dicekeeper-edge-production-headers
  namespace: student-it200233
  labels:
    app: dicekeeper
    app.kubernetes.io/component: public-edge
data:
  X-Forwarded-Host: dicekeeper.net
  X-Forwarded-Proto: https
  X-Forwarded-Port: "443"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dicekeeper-edge-auth-headers
  namespace: student-it200233
  labels:
    app: keycloak
    app.kubernetes.io/component: public-edge
data:
  X-Forwarded-Host: auth.dicekeeper.net
  X-Forwarded-Proto: https
  X-Forwarded-Port: "443"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dicekeeper-edge-app
  namespace: student-it200233
  labels:
    app: dicekeeper
    app.kubernetes.io/component: public-edge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-set-headers: student-it200233/dicekeeper-edge-production-headers
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/upstream-vhost: dicekeeper.net
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: it200233.cloud.htl-leonding.ac.at
      http:
        paths:
          - path: /_dicekeeper/prod/app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dicekeeper
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dicekeeper-edge-imagor
  namespace: student-it200233
  labels:
    app: imagor
    app.kubernetes.io/component: public-edge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-set-headers: student-it200233/dicekeeper-edge-production-headers
    nginx.ingress.kubernetes.io/rewrite-target: /imagor/$2
    nginx.ingress.kubernetes.io/upstream-vhost: dicekeeper.net
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: it200233.cloud.htl-leonding.ac.at
      http:
        paths:
          - path: /_dicekeeper/prod/imagor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: imagor
