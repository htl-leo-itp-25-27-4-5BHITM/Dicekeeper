apiVersion: v1
kind: Service
metadata:
  name: dicekeeper-devbox
  namespace: student-it200233
  labels:
    app.kubernetes.io/name: dicekeeper-devbox
    app.kubernetes.io/component: workspace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dicekeeper-devbox
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: debug
      port: 5005
      targetPort: debug
      protocol: TCP
