apiVersion: apps/v1
kind: Deployment
metadata:
  name: dicekeeper-devbox
  namespace: student-it200233
  labels:
    app.kubernetes.io/name: dicekeeper-devbox
    app.kubernetes.io/component: workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dicekeeper-devbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dicekeeper-devbox
        app.kubernetes.io/component: workspace
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-workspace
          image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/dicekeeper-devbox:development
          imagePullPolicy: Always
          workingDir: /workspace
          command:
            - /usr/local/bin/init-dicekeeper-workspace
          env:
            - name: REPOSITORY_URL
              value: https://github.com/htl-leo-itp-25-27-4-5BHITM/Dicekeeper.git
            - name: REPOSITORY_BRANCH
              value: develop
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      containers:
        - name: devbox
          image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/dicekeeper-devbox:development
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: debug
              containerPort: 5005
              protocol: TCP
          env:
            - name: DICEKEEPER_SKIP_LOCAL_PORT_FORWARDS
              value: "1"
            - name: DEV_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-db-secret
                  key: username
            - name: DEV_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-db-secret
                  key: password
            - name: DEV_DB_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-db-secret
                  key: jdbc-url
            - name: DEV_KEYCLOAK_AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-secret
                  key: KEYCLOAK_AUTH_SERVER_URL
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-secret
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-secret
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-secret
                  key: KEYCLOAK_STATE_SECRET
            - name: IMAGOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: dicekeeper-dev-secret
                  key: IMAGOR_SECRET
            - name: KEYCLOAK_ADMIN_ENABLED
              value: "false"
            - name: QUARKUS_OIDC_AUTHENTICATION_USER_INFO_REQUIRED
              value: "false"
            - name: QUARKUS_OIDC_TOKEN_STATE_MANAGER_STRATEGY
              value: id-token
          readinessProbe:
            exec:
              command:
                - test
                - -d
                - /workspace/dicekeeper/.git
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: dicekeeper-devbox-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
