# Install as /etc/nginx/sites-available/dicekeeper.net. Certificate material is
# provisioned separately; see docs/operations/edge-routing.md.

map $http_upgrade $dicekeeper_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream dicekeeper_leocloud_https {
    server it200233.cloud.htl-leonding.ac.at:443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dicekeeper.net auth.dicekeeper.net dev.dicekeeper.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dicekeeper.net;

    ssl_certificate /etc/nginx/tls/dicekeeper.net/origin.pem;
    ssl_certificate_key /etc/nginx/tls/dicekeeper.net/origin.key;

    client_max_body_size 100m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name it200233.cloud.htl-leonding.ac.at;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Host it200233.cloud.htl-leonding.ac.at;
    proxy_set_header X-Forwarded-Host dicekeeper.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dicekeeper_connection_upgrade;

    location = /imagor {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/prod/imagor$request_uri;
    }

    location ^~ /imagor/ {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/prod/imagor$request_uri;
    }

    location / {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/prod/app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.dicekeeper.net;

    ssl_certificate /etc/nginx/tls/dicekeeper.net/origin.pem;
    ssl_certificate_key /etc/nginx/tls/dicekeeper.net/origin.key;

    client_max_body_size 100m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name it200233.cloud.htl-leonding.ac.at;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Host it200233.cloud.htl-leonding.ac.at;
    proxy_set_header X-Forwarded-Host auth.dicekeeper.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dicekeeper_connection_upgrade;

    location / {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/auth$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.dicekeeper.net;

    ssl_certificate /etc/nginx/tls/dicekeeper.net/origin.pem;
    ssl_certificate_key /etc/nginx/tls/dicekeeper.net/origin.key;

    client_max_body_size 100m;
    proxy_buffering off;
    proxy_request_buffering off;
