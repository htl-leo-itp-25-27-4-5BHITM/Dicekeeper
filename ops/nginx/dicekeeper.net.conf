    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name it200233.cloud.htl-leonding.ac.at;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Host it200233.cloud.htl-leonding.ac.at;
    proxy_set_header X-Forwarded-Host dev.dicekeeper.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dicekeeper_connection_upgrade;

    location = /imagor {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/dev/imagor$request_uri;
    }

    location ^~ /imagor/ {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/dev/imagor$request_uri;
    }

    location / {
        proxy_pass https://dicekeeper_leocloud_https/_dicekeeper/dev/app$request_uri;
    }
}
