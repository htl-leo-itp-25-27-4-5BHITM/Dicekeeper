# ?? Common ??
quarkus.datasource.db-kind=postgresql
quarkus.devservices.enabled=false

# Upload limits (100MB)
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

# Upload directory (used by CampaignResource and PlayerResource)
%dev.dicekeeper.upload-dir=uploads
%prod.dicekeeper.upload-dir=/app/uploads
imagor.base-path=/imagor
imagor.secret=${IMAGOR_SECRET:}
imagor.signer-type=${IMAGOR_SIGNER_TYPE:sha256}
imagor.signer-truncate=${IMAGOR_SIGNER_TRUNCATE:40}

# Keycloak / OIDC
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:dicekeeper-web}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:replace-me}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=openid,profile,email
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.state-secret=${KEYCLOAK_STATE_SECRET:replace-with-at-least-32-chars-state-secret}
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.error-path=/api/auth/error
quarkus.oidc.authentication.session-expired-path=/api/auth/session-expired
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.token.refresh-expired=true
# Deduplicate simultaneous refreshes for providers that rotate refresh tokens.
# Keep this window short: it only needs to cover concurrent browser requests.
quarkus.oidc.token.refresh-token-cache-time-to-live=${OIDC_REFRESH_TOKEN_CACHE_TIME_TO_LIVE:5S}
quarkus.oidc.authentication.session-age-extension=5M
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/

# Account deletion is opt-in. LeoCloud exposes the configured confidential
# client through KEYCLOAK_CLIENT_ID and KEYCLOAK_CLIENT_SECRET; that client must
# have a service account with only the user-management role required below.
dicekeeper.account-deletion.enabled=${ACCOUNT_DELETION_ENABLED:false}
dicekeeper.account-deletion.marker-retention=${ACCOUNT_DELETION_MARKER_RETENTION:P7D}
dicekeeper.account-deletion.accepted-session-window=${ACCOUNT_DELETION_SESSION_WINDOW:PT8H}
dicekeeper.keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:not-configured}
dicekeeper.keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:not-configured}
dicekeeper.keycloak.admin.connect-timeout=${KEYCLOAK_ADMIN_CONNECT_TIMEOUT:PT3S}
dicekeeper.keycloak.admin.request-timeout=${KEYCLOAK_ADMIN_REQUEST_TIMEOUT:PT5S}

# The logout path is virtual and must still be protected.
quarkus.http.auth.permission.authenticated-logout.paths=/api/auth/logout
quarkus.http.auth.permission.authenticated-logout.policy=authenticated

# ?? Dev profile (local development) ??
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:keeperofthedice}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:dicekeeper}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_JDBC_URL:jdbc:postgresql://localhost:5432/keeperofthedice}
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.http.body.uploads-directory=uploads
%dev.quarkus.oidc.auth-server-url=${DEV_KEYCLOAK_AUTH_SERVER_URL:http://localhost:8000/realms/dicekeeper}
%dev.quarkus.oidc.discovery-enabled=false
%dev.quarkus.oidc.authorization-path=/protocol/openid-connect/auth
%dev.quarkus.oidc.token-path=/protocol/openid-connect/token
%dev.quarkus.oidc.user-info-path=/protocol/openid-connect/userinfo
%dev.quarkus.oidc.jwks-path=/protocol/openid-connect/certs
%dev.quarkus.oidc.end-session-path=/protocol/openid-connect/logout
%dev.quarkus.oidc.token.issuer=any
%dev.dicekeeper.account-deletion.enabled=${DEV_ACCOUNT_DELETION_ENABLED:false}
%dev.dicekeeper.keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:not-configured}
%dev.dicekeeper.keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:not-configured}

# ?? Prod profile (Kubernetes) ??
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://postgres:5432/dicekeeper_prod}
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.http.body.uploads-directory=/app/uploads
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
# ingress-nginx pins the trusted public authority with upstream-vhost while it
# normalizes X-Forwarded-Host to the admitted LeoCloud rule host.
%prod.quarkus.http.proxy.enable-forwarded-host=false
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.token.issuer=any

# Test profile uses an isolated in-memory schema and never contacts OIDC.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dicekeeper;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
%test.quarkus.oidc.enabled=false
%test.dicekeeper.upload-dir=target/test-uploads
%test.dicekeeper.account-deletion.enabled=false
